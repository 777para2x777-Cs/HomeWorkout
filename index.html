<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#eb6834" />
<title>FitCore Home</title>
<meta name="description" content="برنامه تمرین خانگی ۳ روز در هفته، هر جلسه حداکثر ۴۵ دقیقه — با دوچرخه اسپینینگ، دمبل، کش مقاومتی و مت یوگا" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1005" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M2.5 9.5v5M7 8v8M17 8v8M20 9.5v5M9.5 12h5"/></svg>
      </div>
      <div>
        <div class="brand-name">FitCore Home</div>
        <div class="brand-date" id="today-date"></div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-toggle" aria-label="تغییر پوسته">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>
      </button>
    </div>
  </header>

  <main id="view-root"></main>

  <div class="bottom-dock">
    <div class="rest-bar" id="rest-bar" hidden></div>
    <nav class="tabbar">
      <button class="tab-btn active" data-view="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M2 12h2.2M19.8 12H22M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5" stroke-linecap="round"/></svg>
        امروز<span class="tab-dot"></span>
      </button>
      <button class="tab-btn" data-view="week">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v3M16 3v3" stroke-linecap="round"/></svg>
        هفته<span class="tab-dot"></span>
      </button>
      <button class="tab-btn" data-view="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="10" width="3" height="4"/><rect x="18.5" y="10" width="3" height="4"/><rect x="6" y="8" width="3" height="8"/><rect x="15" y="8" width="3" height="8"/><path d="M9 12h6"/></svg>
        تمرین‌ها<span class="tab-dot"></span>
      </button>
      <button class="tab-btn" data-view="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M11 19V5M18 19v-7"/><path d="M3 19h18"/></svg>
        پیشرفت<span class="tab-dot"></span>
      </button>
      <button class="tab-btn" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.4.6a7.7 7.7 0 0 0-1.7-1L14.8 3h-4l-.5 2.7a7.7 7.7 0 0 0-1.7 1l-2.4-.6-2 3.4L6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.4-.6c.5.4 1.1.75 1.7 1L10.8 21h4l.5-2.7c.6-.25 1.2-.6 1.7-1l2.4.6 2-3.4-2-1.5Z"/></svg>
        تنظیمات<span class="tab-dot"></span>
      </button>
    </nav>
  </div>
</div>

<div class="timer-overlay" id="timer-overlay" hidden></div>

<script src="app.js"></script>
</body>
</html>
